# Component labels: applied when a PR changes files in the mapped folder.
comp-abi-types:
  - changed-files:
      - any-glob-to-any-file: 'score/containers_rust/**'
comp-allocator:
  - changed-files:
      - any-glob-to-any-file: 'score/allocator/**'
comp-bitmanipulation:
  - changed-files:
      - any-glob-to-any-file: 'score/bitmanipulation/**'
comp-concurrency:
  - changed-files:
      - any-glob-to-any-file:
          - 'score/concurrency/**'
          - 'score/sync/**'
          - 'score/thread/**'
comp-cpp-containers:
  - changed-files:
      - any-glob-to-any-file: 'score/containers/**'
comp-datetime:
  - changed-files:
      - any-glob-to-any-file: 'score/datetime_converter/**'
comp-filesystem:
  - changed-files:
      - any-glob-to-any-file: 'score/filesystem/**'
comp-flatbuffers:
  - changed-files:
      - any-glob-to-any-file: 'score/flatbuffers/**'
comp-futurecpp:
  - changed-files:
      - any-glob-to-any-file: 'score/language/futurecpp/**'
comp-hash:
  - changed-files:
      - any-glob-to-any-file: 'score/hash/**'
comp-json:
  - changed-files:
      - any-glob-to-any-file: 'score/json/**'
comp-logging:
  - changed-files:
      - any-glob-to-any-file:
          - 'score/mw/log/**'
          - 'score/log_rust/**'
comp-memory:
  - changed-files:
      - any-glob-to-any-file: 'score/memory/**'
comp-network:
  - changed-files:
      - any-glob-to-any-file: 'score/network/**'
comp-osal:
  - changed-files:
      - any-glob-to-any-file: 'score/os/**'
comp-pal:
  - changed-files:
      - any-glob-to-any-file: 'score/pal/**'
comp-result:
  - changed-files:
      - any-glob-to-any-file: 'score/result/**'
comp-safecpp:
  - changed-files:
      - any-glob-to-any-file: 'score/language/safecpp/**'
comp-scope_exit:
  - changed-files:
      - any-glob-to-any-file: 'score/scope_exit/**'
comp-static_reflection_with_serialization:
  - changed-files:
      - any-glob-to-any-file: 'score/static_reflection_with_serialization/**'
comp-string_manipulation:
  - changed-files:
      - any-glob-to-any-file: 'score/string_manipulation/**'
comp-testing_macros:
  - changed-files:
      - any-glob-to-any-file: 'score/testing_macros/**'
comp-tracing:
  - changed-files:
      - any-glob-to-any-file: 'score/analysis/tracing/**'
comp-utils:
  - changed-files:
      - any-glob-to-any-file: 'score/utils/**'
# Documentation label: applied when a PR changes repository or component documentation.
documentation:
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/**'
          - 'score/**/docs/**'
# CI label: applied when a PR changes GitHub Actions or workflows.
ci:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/actions/**'
          - '.github/workflows/**'
# Language labels: applied based on the type of code files changed.
c++:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.h'
          - '**/*.hpp'
          - '**/*.cpp'
          - '**/*.cc'
          - '**/*.cxx'
rust:
  - changed-files:
      - any-glob-to-any-file: '**/*.rs'
bazel:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.bzl'
          - '**/*.bazel'
          - '**/BUILD'
          - '**/WORKSPACE'
          - '**/.bazelrc'
          - '**/.bazelversion'
