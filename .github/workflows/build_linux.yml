name: Bazel Build (Linux)
permissions:
  contents: read
  actions: write
on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
    tags:
      - "v*"
  merge_group:
    types: [checks_requested]
  workflow_call:
jobs:
  linux-build-and-test:
    name: Build and Test ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: score-linux-x86_64
            artifact-name: x86_64-linux
            bazel-config: score-linux-x86_64
            working-directory: "."
            bazel-build-target: "//..."
            bazel-test-target: >-
              //...
          - name: score-linux-x86_64-gcc15
            artifact-name: x86_64-linux-gcc15
            bazel-config: score-linux-x86_64-gcc15
            working-directory: "."
            bazel-build-target: "//..."
            bazel-test-target: >-
              //...
          - name: score-linux-aarch64
            artifact-name: aarch64-linux
            bazel-config: score-linux-aarch64
            working-directory: "."
            bazel-build-target: "//..."
            bazel-test-target: >-
              //...
              -//score/os/test:acl_test
              -//score/os/test:errno_test
              -//score/os/test:socket_test
            # Emulated tests need longer timeouts than native tests.
            bazel-test-extra-flags: "--test_timeout=180,900,2700,10800 --test_tag_filters=-no_rust_doc_test"
          - name: x86_64-linux (examples/integration)
            artifact-name: x86_64-linux-integration
            bazel-config: x86_64-linux
            # This example is a separate Bazel workspace with its own configuration.
            working-directory: "examples/integration"
            bazel-build-target: "//..."
            bazel-test-target: "//..."
    uses: eclipse-score/cicd-workflows/.github/workflows/bazel.yml@d241348e8670bf5b8902d67ff3ac77e7f60f9ec7 # main (2026-11-11)
    with:
      build-targets: ${{ matrix.bazel-build-target }}
      test-targets: ${{ matrix.bazel-test-target }}
      bazel-configs: ${{ matrix.bazel-config }}
      test-args: ${{ matrix.bazel-test-extra-flags || '' }}
      working-directory: ${{ matrix.working-directory }}
      # Keep cached build results separate for each platform and workspace.
      cache-key: ${{ github.workflow }}-linux-build-and-test-${{ matrix.name }}
      # Run the AArch64 test binaries on the x86_64 runner through QEMU.
      apt-packages: ${{ matrix.bazel-config == 'score-linux-aarch64' && 'qemu-user' || '' }}
      disk-cleanup-level: 4
      # The Docs job below selects the native x86_64 report by its fixed name.
      artifact-name: test-report-${{ matrix.artifact-name }}
  json-test-suite-report:
    name: JSONTestSuite known deviations
    needs: linux-build-and-test
    if: ${{ !cancelled() }}
    runs-on: ${{ vars.REPO_RUNNER_LABELS && fromJSON(vars.REPO_RUNNER_LABELS) || 'ubuntu-24.04' }}
    permissions:
      contents: read
    steps:
      - name: Download test report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: test-report-x86_64-linux
          path: test-report
      - name: Report JSONTestSuite known deviations
        run: |
          python3 - <<'EOF'
          import collections
          import glob
          import os
          import xml.etree.ElementTree as ET

          paths = glob.glob("test-report/**/score/json/json_test_suite_test/test.xml", recursive=True)
          if not paths:
              raise SystemExit(0)

          cases_by_reason = collections.defaultdict(list)
          for case in ET.parse(paths[0]).getroot().iter("testcase"):
              for prop in case.iter("property"):
                  if prop.get("name") == "KnownDeviation":
                      cases_by_reason[prop.get("value")].append(case.get("name").split("/")[-1])

          total = sum(len(cases) for cases in cases_by_reason.values())
          lines = [f"JSONTestSuite known deviations: {total}"]
          for reason, cases in sorted(cases_by_reason.items(), key=lambda item: -len(item[1])):
              lines.append(f"  {len(cases):3d}  {reason}")
              lines.extend(f"         {name}" for name in sorted(cases))
          print("\n".join(lines))

          print(f"::notice title=JSONTestSuite::{total} known deviations in score/json, see the job summary")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("### JSONTestSuite known deviations\n\n| Files | Reason |\n|---|---|\n")
              for reason, cases in sorted(cases_by_reason.items(), key=lambda item: -len(item[1])):
                  summary.write(f"| {len(cases)} | {reason} |\n")
          EOF
  coverage-report:
    uses: ./.github/workflows/coverage_report.yml
  docs-build:
    needs: [linux-build-and-test, coverage-report]
    uses: eclipse-score/cicd-workflows/.github/workflows/docs.yml@3f61217cfa69b1d40b366049ace7fc63932e63c2
    permissions:
      contents: read
    with:
      bazel-target: "//:docs"
      retention-days: 5
      tests-report-artifact: "test-report-x86_64-linux"
      coverage-report-artifact: ${{ github.event.repository.name }}_cpp_coverage_report
