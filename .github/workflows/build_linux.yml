name: Bazel Build (Linux)
permissions:
  contents: read
  actions: write
on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
    tags:
      - "v*"
  merge_group:
    types: [checks_requested]
  workflow_call:
jobs:
  # The shared entry point owns common checks and every Linux build/test row.
  # Module YAML selects native, QEMU and nested-workspace execution.
  checks:
    name: Common checks, Linux builds, coverage and docs
    uses: eclipse-score/cicd-workflows/.github/workflows/on-pr.yml@central-workflow
    permissions:
      contents: read
    with:
      workflow-config-yaml: .github/ci.yml
      # These hooks only auto-fix formatting/copyright; common checks verify both.
      skip-pre-commit: true
