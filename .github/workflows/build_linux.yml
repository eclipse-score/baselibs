name: Bazel Build (Linux)
permissions:
  contents: read
  actions: write
on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
    tags:
      - "v*"
  merge_group:
    types: [checks_requested]
  workflow_call:
jobs:
  linux-build-and-test:
    name: Build and Test ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: score-linux-x86_64
            artifact-name: x86_64-linux
            bazel-config: score-linux-x86_64
            working-directory: "."
            bazel-build-target: "//..."
            bazel-test-target: >-
              //...
          - name: score-linux-aarch64
            artifact-name: aarch64-linux
            bazel-config: score-linux-aarch64
            working-directory: "."
            bazel-build-target: "//..."
            bazel-test-target: >-
              //...
              -//score/os/test:acl_test
              -//score/os/test:errno_test
              -//score/os/test:socket_test
            bazel-test-extra-flags: "--test_timeout=180,900,2700,10800 --test_tag_filters=-no_rust_doc_test" # Increase test timeout due to QEMU emulation
          - name: x86_64-linux (examples/integration)
            artifact-name: x86_64-linux-integration
            bazel-config: x86_64-linux
            working-directory: "examples/integration"
            bazel-build-target: "//..."
            bazel-test-target: "//..."
    uses: eclipse-score/cicd-workflows/.github/workflows/bazel.yml@bazel-workflow
    with:
      build-targets: ${{ matrix.bazel-build-target }}
      test-targets: ${{ matrix.bazel-test-target }}
      bazel-configs: ${{ matrix.bazel-config }}
      test-args: ${{ matrix.bazel-test-extra-flags || '' }}
      working-directory: ${{ matrix.working-directory }}
      cache-key: ${{ github.workflow }}-linux-build-and-test-${{ matrix.name }}
      packages: ${{ matrix.bazel-config == 'score-linux-aarch64' && 'qemu-user' || '' }}
      disk-space-level: 4
      artifact-name: test-report-${{ matrix.artifact-name }}
  coverage-report:
    uses: ./.github/workflows/coverage_report.yml
  docs-build:
    needs: [linux-build-and-test, coverage-report]
    uses: eclipse-score/cicd-workflows/.github/workflows/docs.yml@3f61217cfa69b1d40b366049ace7fc63932e63c2
    permissions:
      contents: read
    with:
      bazel-target: "//:docs"
      retention-days: 5
      tests-report-artifact: "test-report-x86_64-linux"
      coverage-report-artifact: ${{ github.event.repository.name }}_cpp_coverage_report
