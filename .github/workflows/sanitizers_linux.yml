name: Bazel Sanitizers (Linux)
permissions:
  contents: read
  actions: write
on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
  merge_group:
    types: [checks_requested]
  workflow_call:
jobs:
  linux-sanitizers:
    uses: eclipse-score/cicd-workflows/.github/workflows/bazel.yml@d241348e8670bf5b8902d67ff3ac77e7f60f9ec7 # main (2026-11-11)
    with:
      test-targets: //score/...
      bazel-configs: score-linux-x86_64 asan_ubsan_lsan
      # Build and run the selected tests without building unrelated targets.
      test-args: --build_tests_only
      cache-key: ${{ github.workflow }}-linux-sanitizers
      disk-cleanup-level: 4
