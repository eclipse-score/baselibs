name: Code Coverage
permissions:
  contents: read
  actions: write
on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
  merge_group:
    types: [checks_requested]
  workflow_call:
jobs:
  coverage-report:
    runs-on: ubuntu-24.04
    steps:
      - uses: eclipse-score/more-disk-space@6a3b48901846bf7f8cc985925157d71a8973e61f # v1
        with:
          level: 4
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Setup Bazel Cache
        uses: eclipse-score/cicd-actions/setup-bazel-cache@659dcbed63f6b7fbde88c7850125ea0a0a92f939
        with:
          unique-cache-name: ${{ github.workflow }}-${{ github.job }}
      - name: Check coverage scope completeness
        run: ./.github/tools/check_coverage_scope.sh
      - name: Run Bazel Coverage (LLVM, C++ + Rust)
        run: |
          # Excluded tests (all keep running in the GCC-based test jobs):
          # - aborts_upon_exception/...: the library interposes
          #   __cxa_allocate_exception, which GNU ld tolerates but ld.lld
          #   rejects as a duplicate symbol; the toolchain_test is expected
          #   to fail by design (eclipse-score/baselibs#7).
          # - floating_point_environment_test: relies on GCC FP-exception
          #   semantics; fails under any Clang build (verified w/o coverage).
          # - network_interface_test: file-scope static StatMock trips the
          #   gmock leak check only under --dynamic_mode=off static linking.
          bazel coverage --lockfile_mode=error --config=llvm_cov --build_tests_only -- //score/... \
          -//score/language/safecpp/aborts_upon_exception/... \
          -//score/language/safecpp/safe_math/details:floating_point_environment_test \
          -//score/os/linux/utils/test:network_interface_test
      - name: Generate HTML Coverage Report
        env:
          # Report-only at introduction; ratchet once a baseline is agreed.
          COVERAGE_THRESHOLD: "0"
        run: |
          bazel run --lockfile_mode=error @score_coverage//:generate_coverage_html -- \
            --yaml tools/coverage/coverage_justifications.yaml \
            --testlogs-subdir score \
            --archive-dir coverage_artifact
      - name: Upload Coverage Artifacts
        uses: actions/upload-artifact@v6
        with:
          # Name kept from the gcov flow: release.yml downloads it by name.
          name: ${{ github.event.repository.name }}_cpp_coverage_report
          path: coverage_artifact/
          include-hidden-files: true
          retention-days: 10

  # QNX on-target coverage (C++): the gcov backend of score_coverage. Tests run
  # in QEMU through score_qnx_unit_tests, which brings the .gcda counters
  # back. Same-repository branches only: the QNX secrets are not exposed to
  # forks on pull_request events.
  qnx-coverage-report:
    name: Coverage bl-x86_64-qnx (gcov, on target)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: eclipse-score/more-disk-space@3fac5780033e636b114cf69e891dc19d640855c2 # v1.1
        with:
          level: 2
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Setup Bazel Cache
        uses: eclipse-score/cicd-actions/setup-bazel-cache@659dcbed63f6b7fbde88c7850125ea0a0a92f939
        with:
          unique-cache-name: ${{ github.workflow }}-${{ github.job }}
      - uses: eclipse-score/cicd-actions/unblock-user-namespace-for-linux-sandbox@30ed908edcf367bc38ebff5b386a244f9b6417a7 # 2025-06-04
      - name: Setup QNX SDP usage
        uses: eclipse-score/cicd-actions/setup-qnx-sdp@a2b3c36fc7d1b9d03880d19935c7ac9cfffe58c6 # 2026-05-19
        with:
          qnx-license: ${{ secrets.SCORE_QNX_LICENSE }}
          qnx-user: ${{ secrets.SCORE_QNX_USER }}
          qnx-password: ${{ secrets.SCORE_QNX_PASSWORD }}
          qnx-credential-helper: .github/tools/qnx_credential_helper.py
          qnx-license-dir: /opt/score_qnx/license
      - name: Install qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Bazel Coverage on QNX (gcov, C++)
        run: |
          set -euo pipefail
          bazel coverage --lockfile_mode=error --config=qnx_cov --build_tests_only \
            --credential_helper=*.qnx.com="${QNX_CREDENTIAL_HELPER}" -- //score/... \
            -//score/language/futurecpp/tests:memory_resource_test \
            -//score/language/futurecpp/tests:zip_iterator_test \
            -//score/os/test:asil_qm_test \
            -//score/os/test:grp_test
      - name: Generate HTML Coverage Report (QNX)
        env:
          COVERAGE_THRESHOLD: "0"
        run: |
          bazel run --lockfile_mode=error @score_coverage//:generate_coverage_html -- \
            --platform qnx \
            --yaml tools/coverage/coverage_justifications.yaml \
            --testlogs-subdir score \
            --archive-dir coverage_artifact_qnx
      - name: Upload Coverage Artifacts (QNX)
        uses: actions/upload-artifact@v6
        with:
          name: ${{ github.event.repository.name }}_cpp_coverage_report_qnx
          path: coverage_artifact_qnx/
          include-hidden-files: true
          retention-days: 10
