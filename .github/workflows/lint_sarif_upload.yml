#
# Fork PRs get a read-only GITHUB_TOKEN, so lint.yml can't upload SARIF for
# them directly. workflow_run always runs this repo's own copy of this file
# with its own permissions, regardless of which fork triggered the run.
name: Upload clang-tidy SARIF
on:
  workflow_run:
    workflows: ["Linter checks"]
    types: [completed]
permissions:
  actions: read
  security-events: write
jobs:
  upload:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download clang-tidy SARIF artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: clang-tidy-sarif
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Read pull request number
        id: pr
        run: echo "number=$(cat pr-number.txt)" >> "$GITHUB_OUTPUT"
      - name: Upload clang-tidy SARIF to code scanning
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: clang-tidy.sarif
          category: clang-tidy
          sha: ${{ github.event.workflow_run.head_sha }}
          ref: refs/pull/${{ steps.pr.outputs.number }}/merge
