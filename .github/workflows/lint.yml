name: Linter checks
permissions:
  contents: read
  actions: write
  security-events: write
on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
  merge_group:
    types: [checks_requested]
  workflow_call:
jobs:
  clang-tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: eclipse-score/more-disk-space@6a3b48901846bf7f8cc985925157d71a8973e61f # v1
        with:
          level: 4
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Setup Bazel Cache
        uses: eclipse-score/cicd-actions/setup-bazel-cache@659dcbed63f6b7fbde88c7850125ea0a0a92f939
        with:
          unique-cache-name: ${{ github.workflow }}-${{ github.job }}
      - name: Bazel Build with clang-tidy
        run: |
          bazel build --config=bl-x86_64-linux --config=clang-tidy --keep_going --output_groups=+rules_lint_machine -- //...
      - name: Collect clang-tidy reports
        if: always()
        run: |
          mkdir -p /tmp/clang-tidy-reports
          find -L bazel-bin -name '*.AspectRulesLintClangTidy.out' -size +0c \
            -exec cp --parents {} /tmp/clang-tidy-reports \;
      - name: Upload clang-tidy reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clang-tidy-reports
          path: /tmp/clang-tidy-reports
          retention-days: 5
          if-no-files-found: ignore
      - name: Set up sarif-multitool
        if: always()
        run: |
          npm install --no-save --prefix /tmp/sarif-multitool @microsoft/sarif-multitool@5.7.0
          chmod +x /tmp/sarif-multitool/node_modules/@microsoft/sarif-multitool-linux/Sarif.Multitool
          echo "/tmp/sarif-multitool/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Clean clang-tidy SARIF reports
        if: always()
        run: |
          python3 .github/tools/clean_clang_tidy_sarif.py --output-dir /tmp/clang-tidy-sarif-clean \
            $(find -L bazel-bin -name '*.AspectRulesLintClangTidy.report')
      - name: Merge and normalize clang-tidy SARIF reports
        if: always()
        run: |
          shopt -s nullglob
          reports=(/tmp/clang-tidy-sarif-clean/*.sarif)
          if [ ${#reports[@]} -eq 0 ]; then
            echo "::warning::no clang-tidy SARIF results to report"
            echo '{"version":"2.1.0","runs":[{"tool":{"driver":{"name":"ClangTidy"}},"results":[]}]}' > /tmp/clang-tidy.sarif
            exit 0
          fi
          sarif-multitool merge "${reports[@]}" --output-file /tmp/clang-tidy-merged.sarif --log ForceOverwrite
          sarif-multitool rewrite /tmp/clang-tidy-merged.sarif --normalize-for-ghas \
            --output /tmp/clang-tidy.sarif --log ForceOverwrite
      - name: Upload clang-tidy SARIF to code scanning
        # Fork PRs get a read-only GITHUB_TOKEN, so this would fail for
        # pull_request; lint_sarif_upload.yml uploads those instead.
        # merge_group runs a transient synthetic merge commit, not a ref we
        # want recorded in code scanning history.
        if: always() && !contains(fromJSON('["pull_request", "merge_group"]'), github.event_name)
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: /tmp/clang-tidy.sarif
          category: clang-tidy
      - name: Prepare clang-tidy SARIF artifact
        # Bundle the SARIF for lint_sarif_upload.yml to upload from a
        # privileged workflow_run (see comment above) or for debugging purposes.
        if: always()
        run: |
          mkdir -p /tmp/clang-tidy-sarif-artifact
          cp /tmp/clang-tidy.sarif /tmp/clang-tidy-sarif-artifact/
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "${{ github.event.pull_request.number }}" > /tmp/clang-tidy-sarif-artifact/pr-number.txt
          fi
      - name: Upload clang-tidy SARIF artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clang-tidy-sarif
          path: /tmp/clang-tidy-sarif-artifact
          retention-days: 5
  lint-clippy:
    uses: eclipse-score/cicd-workflows/.github/workflows/static-analysis.yml@af347722c7ae3ed85518895c11268d96ac728f62
    with:
      # Use only Rust targets for build.
      bazel-targets: "$(bazel query 'kind(\"rust_.*\", //score/...)' | xargs)"
      bazel-config: "lint"
