#
# Runs clang-tidy and Clippy through rules_lint in one job. Each build uses
# fail_on_violation=false so violating targets still produce SARIF; the job
# fails at the end, once everything has been collected and uploaded.
name: Linter checks
permissions:
  contents: read
  actions: write
  security-events: write
on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
  merge_group:
    types: [checks_requested]
  workflow_call:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: eclipse-score/more-disk-space@6a3b48901846bf7f8cc985925157d71a8973e61f # v1
        with:
          level: 4
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Setup Bazel Cache
        uses: eclipse-score/cicd-actions/setup-bazel-cache@659dcbed63f6b7fbde88c7850125ea0a0a92f939
        with:
          unique-cache-name: ${{ github.workflow }}-${{ github.job }}
      - name: Bazel build with clang-tidy
        run: |
          bazel build --config=bl-x86_64-linux --config=clang-tidy --keep_going \
            --output_groups=+rules_lint_machine --@aspect_rules_lint//lint:fail_on_violation=false \
            -- //...
      - name: Bazel build with Clippy
        if: always()
        run: |
          bazel build --config=bl-x86_64-linux --config=lint --keep_going \
            --output_groups=+rules_lint_machine --@aspect_rules_lint//lint:fail_on_violation=false \
            -- $(bazel query 'kind("rust_.*", //score/...)')
      - name: Collect human-readable lint reports
        if: always()
        run: |
          declare -A mnemonics=(
            [clang-tidy]=AspectRulesLintClangTidy
            [clippy]=AspectRulesLintClippy
          )
          for tool in "${!mnemonics[@]}"; do
            mkdir -p "/tmp/lint-reports/${tool}"
            find -L bazel-bin -name "*.${mnemonics[$tool]}.out" -size +0c \
              -exec cp --parents {} "/tmp/lint-reports/${tool}" \;
          done
      - name: Upload human-readable lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          path: /tmp/lint-reports
          retention-days: 5
          if-no-files-found: ignore
      - name: Set up sarif-multitool
        if: always()
        run: |
          npm install --no-save --prefix /tmp/sarif-multitool @microsoft/sarif-multitool@5.7.0
          chmod +x /tmp/sarif-multitool/node_modules/@microsoft/sarif-multitool-linux/Sarif.Multitool
          echo "/tmp/sarif-multitool/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Build merged SARIF per linter
        if: always()
        id: sarif
        run: |
          declare -A mnemonics=(
            [clang-tidy]=AspectRulesLintClangTidy
            [clippy]=AspectRulesLintClippy
          )
          any_violations=0
          for tool in "${!mnemonics[@]}"; do
            if ! .github/tools/build_lint_sarif.sh "${tool}" "${mnemonics[$tool]}"; then
              any_violations=1
            fi
          done
          echo "any_violations=${any_violations}" >> "$GITHUB_OUTPUT"
      - name: Upload clang-tidy SARIF to code scanning
        # Fork PRs have a read-only token (lint_sarif_upload.yml handles those);
        # merge_group has no ref worth recording in code scanning.
        if: always() && !contains(fromJSON('["pull_request", "merge_group"]'), github.event_name)
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: /tmp/lint-sarif/clang-tidy.sarif
          category: clang-tidy
      - name: Upload Clippy SARIF to code scanning
        if: always() && !contains(fromJSON('["pull_request", "merge_group"]'), github.event_name)
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: /tmp/lint-sarif/clippy.sarif
          category: clippy
      - name: Prepare SARIF artifact
        # For lint_sarif_upload.yml to re-upload on fork PRs, and for debugging.
        if: always()
        run: |
          mkdir -p /tmp/lint-sarif-artifact
          cp /tmp/lint-sarif/*.sarif /tmp/lint-sarif-artifact/
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "${{ github.event.pull_request.number }}" > /tmp/lint-sarif-artifact/pr-number.txt
          fi
      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-sarif
          path: /tmp/lint-sarif-artifact
          retention-days: 5
      - name: Fail if any linter reported violations
        if: always()
        run: |
          if [ "${{ steps.sarif.outputs.any_violations }}" = "1" ]; then
            exit 1
          fi
