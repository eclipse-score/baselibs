# QNX on-target coverage (C++): the gcov backend of score_coverage. Tests run
# in QEMU through score_qnx_unit_tests, which brings the .gcda counters back;
# Bazel's collector turns them into LCOV and the gcov reporter produces the
# same archive layout as the Linux job in coverage_report.yml.
#
# Separate workflow on pull_request_target, like build_qnx.yml: the QNX SDP
# secrets are needed, and fork PRs only get them after a maintainer approved
# the run through the "workflow-approval" environment. Same-repository PRs,
# pushes to main and the merge queue run without approval.
name: Code coverage (QNX, gcov on target)
on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
  actions: write
concurrency:
  group: coverage-qnx-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}
jobs:
  approval:
    name: Approval (fork PRs only)
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    environment: workflow-approval
    runs-on: ubuntu-24.04
    steps:
      - name: Blocking on approval
        run: 'true'
  qnx-coverage-report:
    name: Coverage score-qnx-x86_64 (gcov, on target)
    needs: approval
    if: ${{ !cancelled() && (needs.approval.result == 'success' || needs.approval.result == 'skipped') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: eclipse-score/more-disk-space@3fac5780033e636b114cf69e891dc19d640855c2 # v1.1
        with:
          level: 2
      # pull_request_target runs this workflow from the base branch with the
      # repository secrets; check out the PR head explicitly (gated by the
      # approval job for forks) so the PR's code is what gets measured.
      - name: Checkout repository (PR head)
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      - name: Setup Bazel Cache
        uses: eclipse-score/cicd-actions/setup-bazel-cache@659dcbed63f6b7fbde88c7850125ea0a0a92f939
        with:
          unique-cache-name: ${{ github.workflow }}-${{ github.job }}
      - uses: eclipse-score/cicd-actions/unblock-user-namespace-for-linux-sandbox@30ed908edcf367bc38ebff5b386a244f9b6417a7 # 2025-06-04
      - name: Setup QNX SDP usage
        uses: eclipse-score/cicd-actions/setup-qnx-sdp@a2b3c36fc7d1b9d03880d19935c7ac9cfffe58c6 # 2026-05-19
        with:
          qnx-license: ${{ secrets.SCORE_QNX_LICENSE }}
          qnx-user: ${{ secrets.SCORE_QNX_USER }}
          qnx-password: ${{ secrets.SCORE_QNX_PASSWORD }}
          qnx-credential-helper: .github/tools/qnx_credential_helper.py
          qnx-license-dir: /opt/score_qnx/license
      - name: Install qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Bazel Coverage on QNX (gcov, C++)
        run: |
          set -euo pipefail
          bazel coverage --lockfile_mode=error --config=qnx_cov --build_tests_only \
            --credential_helper=*.qnx.com="${QNX_CREDENTIAL_HELPER}" -- //score/... \
            -//score/language/futurecpp/tests:memory_resource_test \
            -//score/language/futurecpp/tests:zip_iterator_test \
            -//score/os/test:asil_qm_test \
            -//score/os/test:grp_test
      - name: Generate HTML Coverage Report (QNX)
        env:
          COVERAGE_THRESHOLD: "0"
        run: |
          bazel run --lockfile_mode=error @score_coverage//:generate_coverage_html -- \
            --platform qnx \
            --yaml tools/coverage/coverage_justifications.yaml \
            --testlogs-subdir score \
            --archive-dir coverage_artifact_qnx
      - name: Upload Coverage Artifacts (QNX)
        uses: actions/upload-artifact@v6
        with:
          name: ${{ github.event.repository.name }}_cpp_coverage_report_qnx
          path: coverage_artifact_qnx/
          include-hidden-files: true
          retention-days: 10
