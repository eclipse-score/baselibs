name: Daily Maintenance
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write
  pages: write
  id-token: write
jobs:
  daily-cleanup:
    uses: eclipse-score/cicd-workflows/.github/workflows/daily.yml@2d1dc93f0edb9f99dbcce4c0065d31d73996f04a
    with:
      skip-stale-prs: true
      skip-docs-link-check: true
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
      pages: write
      id-token: write
