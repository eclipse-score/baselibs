name: Daily Maintenance
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  daily-cleanup:
    uses: eclipse-score/cicd-workflows/.github/workflows/daily.yml@b775b8e8e53aa6fcc9f47afc6d62cc8b66bbe18f
    with:
      skip-stale-prs: true
    permissions:
      contents: write
      pages: write
      id-token: write
      actions: write
