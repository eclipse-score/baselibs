name: PR Labeler
permissions:
  contents: read
  pull-requests: write
on:
  pull_request_target:
    types: [opened, reopened, synchronize]
jobs:
  label:
    name: Apply labels based on changed paths
    runs-on: ubuntu-slim
    steps:
      - name: Label pull request
        uses: actions/labeler@v7
        with:
          sync-labels: true
