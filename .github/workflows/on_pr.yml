name: Checks for Bazel lock, copyright and format
on:
  pull_request:
    types: [opened, reopened, synchronize]
  merge_group:
    types: [checks_requested]
jobs:
  checks:
    uses: eclipse-score/cicd-workflows/.github/workflows/on-pr.yml@016ac00faab049c07fb1270dd7e173e6e8e3e143 # main on: 19-10-2026
    with:
      skip-pre-commit: true
      skip-python-tests: true
      format-target: "//tools:format.check"
      copyright-target: "//tools:copyright-check"
    permissions:
      contents: read
