name: Checks for Bazel lock, copyright and format
on:
  pull_request:
    types: [opened, reopened, synchronize]
  merge_group:
    types: [checks_requested]
jobs:
  checks:
    uses: eclipse-score/cicd-workflows/.github/workflows/on-pr.yml@0bfa9822cc2df460b2172ec18f5acafa65316e68 # main branch as of 21-10-2026
    with:
      skip-pre-commit: true
      skip-python-tests: true
      require-bzlmod-lock: true
      format-target: "//tools:format.check"
      copyright-target: "//tools:copyright-check"
    permissions:
      contents: read
