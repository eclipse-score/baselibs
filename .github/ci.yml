# The shared workflow owns the complete native Linux build and test selection.
# ARM runtime tests and the nested integration workspace have dedicated jobs.
# Bazel configs select module-owned platforms and toolchains explicitly.
schema-version: 2
variants:
  - name: linux-native
    architecture:
      - name: x86_64
    os:
      - name: linux
    checks:
      tests:
        # Build all native targets before running the complete module test set.
        # Both commands must produce Bazel evidence for the shared gate to pass.
        - test-type: unit
          bazel-configs: score-linux-x86_64
          bazel-build-targets: //...
          bazel-test-targets: //...
