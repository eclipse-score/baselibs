repos:
  - repo: local
    hooks:
      - id: copyright-fix
        name: //tools:copyright.fix
        entry: bazel run //tools:copyright.fix
        language: system
        pass_filenames: false
      - id: format-fix
        name: //tools:format.fix
        entry: bazel run //tools:format.fix
        language: system
        pass_filenames: false
