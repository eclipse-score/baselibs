# Only the baselibs feature requirements of the platform-wide needs.json.
conversion-rules:
  - need-type: feat_req
    kind: FeatReq
    namespace: req
    version-field: version
    description-fields: content
    status-field: status
    exclude-status: [invalid]
    id-pattern: ^feat_req__baselibs__
